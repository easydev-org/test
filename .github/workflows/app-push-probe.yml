name: app-push-probe
# Can a WORKFLOW push its own progress into a check run, and can a PAT read it back?
#
# The runner cannot reach our cluster, so anything "live" has to land somewhere GitHub serves.
# A check run's output.text holds 65535 characters and is readable with a plain GET — the only
# channel with room. Creating one normally needs a GitHub App; the question here is whether the
# workflow's own GITHUB_TOKEN, granted checks: write, is enough.
#
# Kept as a standalone script file because a nested heredoc inside a YAML block scalar confuses the
# parser: the first attempt at this produced a workflow GitHub rejected as having no dispatch trigger.
on:
  workflow_dispatch:
permissions:
  contents: read
  checks: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: push progress into a check run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: python3 .github/scripts/push_probe.py
