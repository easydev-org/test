name: backscroll-probe
# A workflow that prints on a timer, so the backscroll endpoint can be probed WHILE the step runs.
#
# Three steps of different lengths, because the interesting question is not only "can I read a
# running step" but "which step's UUID do I need, and does a finished step still answer".
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: quick
        run: |
          echo "quick step line 1"
          echo "quick step line 2"
      - name: slow
        run: |
          for i in $(seq 1 20); do
            echo "slow tick $i at $(date -u +%H:%M:%S)"
            sleep 3
          done
      - name: after
        run: echo "after the slow step"
